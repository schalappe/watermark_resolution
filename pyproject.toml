[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watermark-resolution"
version = "0.2.0"
description = "PyTorch reproduction of a CNN watermarking network adaptive to image and watermark resolution"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "certifi>=2025",
    "click>=8.2",
    "kornia>=0.8",
    "numpy>=2",
    "pillow>=11",
    "torch>=2.8",
]

[dependency-groups]
dev = [
    "pyrefly>=0.40",
    "pytest>=8",
    "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/watermark"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = ["RUF001", "RUF002", "RUF003"]  # ×, →, λ follow the paper's notation
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
