[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watermark-resolution"
version = "0.1.0"
description = "CNN-based digital image watermarking adaptive to image and watermark resolution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "imgaug>=0.4.0,<0.5.0",
    "loguru>=0.7",
    "pydot==1.4.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rich>=13.6",
    "scikit-learn>=1.5,<2",
    "tensorflow>=2.15,<2.16",
]

[dependency-groups]
dev = [
    "ipywidgets==8.1.1",
    "jupyterlab>=4.0.0",
    "optuna==3.5.0",
    "optuna-dashboard==0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
